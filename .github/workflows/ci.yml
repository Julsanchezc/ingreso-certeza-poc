name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principio de menor privilegio: restringe GITHUB_TOKEN a lectura exclusiva del repositorio,
# impidiendo escritura sobre código, paquetes, issues o releases ante posibles vectores en dependencias o scripts.
permissions:
  contents: read

jobs:
  test:
    name: Pruebas y validación de artefactos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar artefactos esenciales no vacíos
        run: |
          test -s db/schema.sql || { echo "Fallo: db/schema.sql no existe o está vacío." >&2; exit 1; }
          test -s web-demo/index.html || { echo "Fallo: web-demo/index.html no existe o está vacío." >&2; exit 1; }

      - name: Ejecutar pruebas unitarias
        run: npm test
